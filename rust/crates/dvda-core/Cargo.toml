[package]
name = "dvda-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rust-mlp"]
rust-mlp = ["dep:dvda-mlp"]

[dependencies]
dvda-audio = { path = "../dvda-audio" }
dvda-author = { path = "../dvda-author" }
dvda-image = { path = "../dvda-image" }
dvda-bridges = { path = "../dvda-bridges", features = ["media", "menu"] }
dvda-mlp = { path = "../dvda-mlp", optional = true }
dvda-native = { path = "../dvda-native" }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "=0.11.1", default-features = false }

[[example]]
name = "embedded_runtime"

[lints]
workspace = true
