[workspace]
resolver = "3"
members = ["crates/dvda-core", "crates/dvda-cli", "crates/dvda-native", "crates/dvda-desktop", "crates/dvda-toolchain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
