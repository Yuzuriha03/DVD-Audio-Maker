[workspace]
resolver = "3"
members = ["crates/dvda-core", "crates/dvda-cli", "crates/dvda-native", "crates/dvda-desktop", "crates/dvda-toolchain", "crates/dvda-menu", "crates/dvda-mlp", "crates/dvda-bridges", "crates/dvda-author"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
overflow-checks = false

[profile.release.package."*"]
opt-level = 3

# Fast development builds with some optimization
[profile.dev]
opt-level = 1

# Benchmarking profile
[profile.bench]
inherits = "release"
lto = "fat"
