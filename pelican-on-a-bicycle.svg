        <path d="M0-107V107 M-107 0H107 M-75.66-75.66 75.66 75.66 M-75.66 75.66 75.66-75.66"/>
        <path d="M-40.95-98.86 40.95 98.86 M-98.86-40.95 98.86 40.95 M-98.86 40.95 98.86-40.95 M-40.95 98.86 40.95-98.86"/>
