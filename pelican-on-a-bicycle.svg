<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="description">A cheerful white pelican with a golden bill and a fluttering coral scarf pedals a teal bicycle beside the sea, under a warm yellow sun.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5f2ed"/>
      <stop offset="1" stop-color="#f5f5e9"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffd881"/>
      <stop offset="1" stop-color="#f3ac64"/>
    </linearGradient>
    <clipPath id="round-scene">
      <circle cx="480" cy="397" r="318"/>
    </clipPath>
    <g id="wheel">
      <circle r="122" fill="#faf8ef" stroke="#293f43" stroke-width="15"/>
      <circle r="110" fill="none" stroke="#b8ceca" stroke-width="3"/>
